<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clock</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="box">
      <div class="buttons">
        <button id="clockTab" class="active" onclick="showClock()">Clock</button>
        <button id="timerTab" onclick="showTimer()">Timer</button>
      </div>

      <div id="Clock" class="ClockShow">
        <span id="time"></span>
      </div>

      <div id="Timer" class="TimerHide">
        <div class="ring-wrap">
          <svg class="ring" viewBox="0 0 200 200">
            <defs>
              <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#7dd3fc" />
                <stop offset="50%" stop-color="#f9a8d4" />
                <stop offset="100%" stop-color="#e879f9" />
              </linearGradient>
            </defs>
            <circle class="ring-bg" cx="100" cy="100" r="90" />
            <circle class="ring-progress" id="progress" cx="100" cy="100" r="90" />
          </svg>
          <span id="timerText">05:00</span>
        </div>

        <div class="presets">
          <button onclick="setTimer(60)">1m</button>
          <button onclick="setTimer(300)">5m</button>
          <button onclick="setTimer(1500)">25m</button>
        </div>

        <div class="controls">
          <button id="startBtn" onclick="toggleTimer()">Start</button>
          <button onclick="resetTimer()">Reset</button>
        </div>
      </div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
